name: Actualizar catálogo Shokz desde Impact V3

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar sincronización aunque Impact no indique cambios"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "37 05 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-catalogo-shokz-impact
  cancel-in-progress: false

jobs:
  actualizar:
    name: Descargar, validar y publicar Shokz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
      IMPACT_API_TOKEN: ${{ secrets.IMPACT_API_TOKEN }}
      IMPACT_EXPECTED_CAMPAIGN_ID: "3800995"
      IMPACT_EXPECTED_CATALOG_SOURCE: "CATF_31438"
      IMPACT_TRACKING_HOST: "shokzes.pxf.io"
      IMPACT_PUBLISHER_ID: "7518894"
      IMPACT_CREATIVE_ID: "48345"
      MIN_ACCEPTED_PRODUCTS: "5"
      MAX_PRODUCT_DROP_PERCENT: "50"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verificar credenciales
        shell: bash
        run: |
          set -euo pipefail
          : "${IMPACT_ACCOUNT_SID:?Falta el secreto IMPACT_ACCOUNT_SID}"
          : "${IMPACT_API_TOKEN:?Falta el secreto IMPACT_API_TOKEN}"

      - name: Localizar catálogo Shokz
        id: catalog
        shell: bash
        env:
          FORCE_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          set -euo pipefail

          CATALOGS_JSON="${RUNNER_TEMP}/impact-catalogs.json"

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 180 \
            --user "${IMPACT_ACCOUNT_SID}:${IMPACT_API_TOKEN}" \
            --header "Accept: application/json" \
            --header "IR-Version: 15" \
            --output "${CATALOGS_JSON}" \
            "https://api.impact.com/Mediapartners/${IMPACT_ACCOUNT_SID}/Catalogs"

          python3 - "${CATALOGS_JSON}" "${GITHUB_OUTPUT}" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          catalogs_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          payload = json.loads(catalogs_path.read_text(encoding="utf-8"))

          def extract_catalogs(value):
              if isinstance(value, list):
                  return [item for item in value if isinstance(item, dict)]
              if not isinstance(value, dict):
                  return []
              for key in ("Catalogs", "catalogs"):
                  nested = value.get(key)
                  if isinstance(nested, list):
                      return [item for item in nested if isinstance(item, dict)]
                  if isinstance(nested, dict):
                      for child_key in ("Catalog", "catalog"):
                          child = nested.get(child_key)
                          if isinstance(child, list):
                              return [item for item in child if isinstance(item, dict)]
                          if isinstance(child, dict):
                              return [child]
              return [value] if "Id" in value and "Name" in value else []

          catalogs = extract_catalogs(payload)
          if not catalogs:
              raise SystemExit("Impact no devolvió catálogos.")

          campaign_id = os.environ["IMPACT_EXPECTED_CAMPAIGN_ID"].strip()
          source = os.environ["IMPACT_EXPECTED_CATALOG_SOURCE"].strip()
          source_match = re.search(r"(\d+)$", source)
          preferred_catalog_id = source_match.group(1) if source_match else ""

          def text(item):
              return " ".join(
                  str(item.get(key) or "")
                  for key in ("AdvertiserName", "CampaignName", "Name")
              ).lower()

          candidates = [
              item for item in catalogs
              if (
                  str(item.get("CampaignId") or "") == campaign_id
                  or "shokz" in text(item)
              )
              and str(item.get("Currency") or "").upper() == "EUR"
          ]

          exact = [
              item for item in candidates
              if preferred_catalog_id
              and str(item.get("Id") or "") == preferred_catalog_id
          ]
          if exact:
              selected = exact[0]
          elif len(candidates) == 1:
              selected = candidates[0]
          else:
              details = [
                  {
                      "Id": item.get("Id"),
                      "Name": item.get("Name"),
                      "CampaignId": item.get("CampaignId"),
                      "Currency": item.get("Currency"),
                  }
                  for item in candidates
              ]
              raise SystemExit(
                  "No se pudo seleccionar un único catálogo Shokz: "
                  + json.dumps(details, ensure_ascii=False)
              )

          catalog_id = str(selected.get("Id") or "").strip()
          updated = str(selected.get("DateLastUpdated") or "").strip()
          item_count = str(selected.get("NumberOfItems") or "").strip()
          name = str(selected.get("Name") or "").strip()

          state_path = Path("data/catalog/import-reports/shokz-es-api-state.json")
          previous = {}
          if state_path.exists():
              try:
                  previous = json.loads(state_path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  previous = {}

          force = os.environ.get("FORCE_SYNC", "false").lower() == "true"
          unchanged = (
              not force
              and previous.get("catalogId") == catalog_id
              and previous.get("dateLastUpdated") == updated
              and bool(updated)
          )

          values = {
              "catalog_id": catalog_id,
              "catalog_name": name,
              "catalog_updated": updated,
              "catalog_items": item_count,
              "skip": "true" if unchanged else "false",
          }

          with output_path.open("a", encoding="utf-8") as output:
              for key, value in values.items():
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"Salida inválida en {key}")
                  output.write(f"{key}={value}\n")

          print(
              json.dumps(
                  {
                      "catalogId": catalog_id,
                      "name": name,
                      "dateLastUpdated": updated,
                      "numberOfItems": item_count,
                      "skip": unchanged,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      - name: Informar que no hay cambios
        if: steps.catalog.outputs.skip == 'true'
        shell: bash
        run: |
          {
            echo "# Catálogo Shokz sin cambios"
            echo
            echo "Impact no ha actualizado el catálogo desde la última sincronización."
            echo
            echo "- Catálogo: ${{ steps.catalog.outputs.catalog_name }}"
            echo "- ID: ${{ steps.catalog.outputs.catalog_id }}"
            echo "- Última actualización: ${{ steps.catalog.outputs.catalog_updated }}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Descargar productos mediante la API de Impact
        if: steps.catalog.outputs.skip != 'true'
        id: download
        shell: bash
        env:
          CATALOG_ID: ${{ steps.catalog.outputs.catalog_id }}
        run: |
          set -euo pipefail

          FEED_PATH="${RUNNER_TEMP}/shokz-impact-api.tsv"

          python3 - "${FEED_PATH}" <<'PY'
          import base64
          import csv
          import json
          import os
          import sys
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import parse_qs, urlencode, urljoin, urlparse
          from urllib.request import Request, urlopen

          destination = Path(sys.argv[1])
          account_sid = os.environ["IMPACT_ACCOUNT_SID"].strip()
          token = os.environ["IMPACT_API_TOKEN"].strip()
          catalog_id = os.environ["CATALOG_ID"].strip()
          campaign_id = os.environ["IMPACT_EXPECTED_CAMPAIGN_ID"].strip()
          catalog_source = os.environ["IMPACT_EXPECTED_CATALOG_SOURCE"].strip()
          tracking_host = os.environ["IMPACT_TRACKING_HOST"].strip()
          publisher_id = os.environ["IMPACT_PUBLISHER_ID"].strip()
          creative_id = os.environ["IMPACT_CREATIVE_ID"].strip()

          authorization = base64.b64encode(
              f"{account_sid}:{token}".encode("utf-8")
          ).decode("ascii")

          def api_get(url):
              request = Request(
                  url,
                  headers={
                      "Authorization": f"Basic {authorization}",
                      "Accept": "application/json",
                      "IR-Version": "15",
                      "User-Agent": "SecretShop-Shokz-Catalog/1.0",
                  },
              )
              try:
                  with urlopen(request, timeout=180) as response:
                      return json.load(response)
              except HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")[:1000]
                  raise SystemExit(
                      f"Impact devolvió HTTP {error.code} al consultar productos: {body}"
                  )
              except URLError as error:
                  raise SystemExit(f"No se pudo conectar con Impact: {error}")

          def extract_items(payload):
              if isinstance(payload, list):
                  return [item for item in payload if isinstance(item, dict)]
              if not isinstance(payload, dict):
                  return []

              for key in ("Items", "CatalogItems", "items", "catalogItems"):
                  value = payload.get(key)
                  if isinstance(value, list):
                      return [item for item in value if isinstance(item, dict)]

              # Compatibilidad defensiva con posibles envoltorios adicionales.
              for value in payload.values():
                  if (
                      isinstance(value, list)
                      and value
                      and all(isinstance(item, dict) for item in value)
                      and any(
                          any(field in item for field in ("CatalogItemId", "Url", "Name"))
                          for item in value
                      )
                  ):
                      return value
              return []

          base_url = (
              f"https://api.impact.com/Mediapartners/{account_sid}"
              f"/Catalogs/{catalog_id}/Items"
          )

          all_items = []
          seen_ids = set()
          page = 1

          while True:
              separator = "&" if "?" in base_url else "?"
              payload = api_get(f"{base_url}{separator}PageSize=200&Page={page}")
              items = extract_items(payload)

              if not items and page == 1:
                  top_keys = sorted(payload.keys()) if isinstance(payload, dict) else []
                  raise SystemExit(
                      "Impact respondió sin productos. "
                      f"Claves principales de la respuesta: {top_keys}"
                  )

              for item in items:
                  identity = str(
                      item.get("Id")
                      or item.get("CatalogItemId")
                      or item.get("Url")
                      or ""
                  ).strip()
                  if not identity:
                      raise SystemExit("Impact devolvió un producto sin identificador.")
                  if identity in seen_ids:
                      continue
                  seen_ids.add(identity)
                  all_items.append(item)

              try:
                  pages = int(str(payload.get("@numpages") or page))
              except (TypeError, ValueError):
                  pages = page

              try:
                  total = int(str(payload.get("@total") or len(all_items)))
              except (TypeError, ValueError):
                  total = len(all_items)

              if page >= pages or len(all_items) >= total or not items:
                  break
              page += 1

              if page > 100:
                  raise SystemExit("Paginación de Impact anormal: más de 100 páginas.")

          if not all_items:
              raise SystemExit("El catálogo no contiene productos accesibles mediante API.")

          def scalar(value):
              if value is None:
                  return ""
              if isinstance(value, bool):
                  return "true" if value else "false"
              if isinstance(value, (list, tuple)):
                  return ", ".join(str(item).strip() for item in value if str(item).strip())
              return str(value).strip()

          def first(value):
              if isinstance(value, list):
                  for item in value:
                      result = scalar(item)
                      if result:
                          return result
                  return ""
              return scalar(value)

          def affiliate_url(item, sku):
              raw = scalar(
                  item.get("Url")
                  or item.get("TrackingUrl")
                  or item.get("ProductUrl")
              )
              if not raw:
                  return ""

              try:
                  parsed = urlparse(raw)
              except ValueError:
                  return ""

              if parsed.scheme != "https":
                  return ""

              # Preserve a valid Impact URL when the API already supplies it.
              if parsed.hostname and parsed.hostname.lower() == tracking_host.lower():
                  return raw

              query = urlencode(
                  {
                      "prodsku": sku,
                      "u": raw,
                      "intsrc": catalog_source,
                  }
              )
              return (
                  f"https://{tracking_host}/c/"
                  f"{publisher_id}/{campaign_id}/{creative_id}?{query}"
              )

          headers = [
              "Unique Merchant SKU",
              "Product Name",
              "Product URL",
              "Image URL",
              "Current Price",
              "Stock Availability",
              "Parent SKU",
              "Parent Name",
              "Currency",
              "Labels",
              "Alternative Image URL 1",
              "Alternative Image URL 2",
              "Alternative Image URL 3",
              "Alternative Image URL 4",
              "Alternative Image URL 5",
              "Color",
              "Product Description",
              "Category",
              "UPC",
              "EAN",
              "MPN",
              "Original Price",
              "Product Bullet Point 1",
              "Material",
              "Promotion",
              "Size",
          ]

          rows = []
          for item in all_items:
              raw_url = scalar(
                  item.get("Url")
                  or item.get("TrackingUrl")
                  or item.get("ProductUrl")
              )
              parsed_query = {}
              if raw_url:
                  try:
                      parsed_query = parse_qs(urlparse(raw_url).query)
                  except ValueError:
                      parsed_query = {}

              sku = scalar(
                  first(parsed_query.get("prodsku"))
                  or item.get("Sku")
                  or item.get("ProductSku")
                  or item.get("MerchantSku")
                  or item.get("CatalogItemId")
                  or item.get("Id")
              )
              if not sku:
                  raise SystemExit("No se pudo determinar el SKU de un producto.")

              availability = scalar(item.get("StockAvailability")).lower()
              in_stock = availability in {
                  "instock",
                  "in_stock",
                  "limitedavailability",
                  "limited_availability",
                  "y",
                  "yes",
                  "true",
              }

              gtin = scalar(item.get("Gtin"))
              gtin_type = scalar(item.get("GtinType")).upper()
              additional_images = item.get("AdditionalImageUrls") or []
              if isinstance(additional_images, str):
                  additional_images = [additional_images]
              additional_images = [
                  scalar(value) for value in additional_images if scalar(value)
              ][:5]

              bullets = item.get("Bullets") or []
              labels = item.get("Labels") or []
              colors = item.get("Colors") or []

              row = {
                  "Unique Merchant SKU": sku,
                  "Product Name": scalar(item.get("Name")),
                  "Product URL": affiliate_url(item, sku),
                  "Image URL": scalar(item.get("ImageUrl")),
                  "Current Price": scalar(item.get("CurrentPrice")),
                  "Stock Availability": "Y" if in_stock else "N",
                  "Parent SKU": scalar(item.get("ParentSku")),
                  "Parent Name": scalar(item.get("ParentName")),
                  "Currency": scalar(item.get("Currency")),
                  "Labels": scalar(labels),
                  "Color": first(colors),
                  "Product Description": scalar(item.get("Description")),
                  "Category": scalar(
                      item.get("Category")
                      or item.get("OriginalFormatCategory")
                  ),
                  "UPC": gtin if gtin_type == "UPC" else "",
                  "EAN": gtin if gtin_type == "EAN" else "",
                  "MPN": scalar(item.get("Mpn")),
                  "Original Price": scalar(item.get("OriginalPrice")),
                  "Product Bullet Point 1": first(bullets),
                  "Material": scalar(item.get("Material")),
                  "Promotion": scalar(
                      item.get("Promotion")
                      or item.get("PromotionalText")
                  ),
                  "Size": scalar(item.get("Size")),
              }

              for index in range(5):
                  row[f"Alternative Image URL {index + 1}"] = (
                      additional_images[index] if index < len(additional_images) else ""
                  )

              rows.append(row)

          destination.parent.mkdir(parents=True, exist_ok=True)
          with destination.open("w", encoding="utf-8", newline="") as output:
              writer = csv.DictWriter(
                  output,
                  fieldnames=headers,
                  delimiter="\t",
                  quoting=csv.QUOTE_MINIMAL,
                  lineterminator="\n",
              )
              writer.writeheader()
              writer.writerows(rows)

          print(
              json.dumps(
                  {
                      "catalogId": catalog_id,
                      "apiProducts": len(all_items),
                      "tsvRows": len(rows),
                      "pages": page,
                      "output": str(destination),
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

          test -s "${FEED_PATH}"
          echo "feed_path=${FEED_PATH}" >> "${GITHUB_OUTPUT}"
          echo "Productos descargados mediante Catalogs/${CATALOG_ID}/Items."
      - name: Validar cabecera del feed
        if: steps.catalog.outputs.skip != 'true'
        shell: bash
        env:
          FEED_PATH: ${{ steps.download.outputs.feed_path }}
        run: |
          set -euo pipefail
          python3 - "${FEED_PATH}" <<'PY'
          import sys

          required = {
              "Unique Merchant SKU",
              "Product Name",
              "Product URL",
              "Image URL",
              "Current Price",
              "Stock Availability",
              "Parent SKU",
              "Parent Name",
              "Currency",
              "Labels",
          }

          with open(sys.argv[1], "rt", encoding="utf-8-sig", newline="") as feed:
              header = feed.readline().rstrip("\r\n").split("\t")

          missing = sorted(required.difference(header))
          if missing:
              raise SystemExit("Faltan columnas obligatorias: " + ", ".join(missing))

          print(f"Cabecera válida: {len(header)} columnas.")
          PY

      - name: Probar importación sin modificar archivos
        if: steps.catalog.outputs.skip != 'true'
        id: dry_run
        shell: bash
        env:
          FEED_PATH: ${{ steps.download.outputs.feed_path }}
        run: |
          set -euo pipefail
          REPORT="${RUNNER_TEMP}/shokz-dry-run.json"
          node scripts/import-impact-shokz.mjs \
            --input "${FEED_PATH}" \
            --dry-run | tee "${REPORT}"
          echo "report_path=${REPORT}" >> "${GITHUB_OUTPUT}"

      - name: Aplicar controles de seguridad
        if: steps.catalog.outputs.skip != 'true'
        shell: bash
        env:
          REPORT_PATH: ${{ steps.dry_run.outputs.report_path }}
        run: |
          set -euo pipefail
          python3 - "${REPORT_PATH}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          accepted = int(report["totals"]["acceptedRows"])
          feed_rows = int(report["totals"]["feedRows"])
          minimum = int(os.environ["MIN_ACCEPTED_PRODUCTS"])
          maximum_drop = float(os.environ["MAX_PRODUCT_DROP_PERCENT"])

          offers = json.loads(
              Path("data/catalog/offers.json").read_text(encoding="utf-8")
          ).get("offers", [])
          previous = sum(
              1 for offer in offers if offer.get("merchantId") == "shokz-es"
          )

          if accepted < minimum:
              raise SystemExit(
                  f"Importación bloqueada: solo {accepted} productos aceptados; "
                  f"mínimo exigido {minimum}."
              )

          if previous >= 10:
              minimum_relative = previous * (1 - maximum_drop / 100)
              if accepted < minimum_relative:
                  raise SystemExit(
                      "Importación bloqueada por caída anormal: "
                      f"{previous} ofertas anteriores frente a {accepted} nuevas."
                  )

          if accepted > feed_rows:
              raise SystemExit("Informe incoherente: aceptados superiores a filas del feed.")

          print(
              json.dumps(
                  {
                      "feedRows": feed_rows,
                      "acceptedRows": accepted,
                      "previousShokzOffers": previous,
                      "maxAllowedDropPercent": maximum_drop,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      - name: Importar catálogo Shokz
        if: steps.catalog.outputs.skip != 'true'
        shell: bash
        env:
          FEED_PATH: ${{ steps.download.outputs.feed_path }}
        run: |
          set -euo pipefail
          node scripts/import-impact-shokz.mjs --input "${FEED_PATH}"

      - name: Reconstruir y validar la web
        if: steps.catalog.outputs.skip != 'true'
        run: npm run quality

      - name: Guardar estado de sincronización
        if: steps.catalog.outputs.skip != 'true'
        shell: bash
        env:
          CATALOG_ID: ${{ steps.catalog.outputs.catalog_id }}
          CATALOG_NAME: ${{ steps.catalog.outputs.catalog_name }}
          CATALOG_UPDATED: ${{ steps.catalog.outputs.catalog_updated }}
          CATALOG_ITEMS: ${{ steps.catalog.outputs.catalog_items }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/catalog/import-reports/shokz-es-api-state.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          payload = {
              "schemaVersion": 1,
              "merchantId": "shokz-es",
              "catalogId": os.environ["CATALOG_ID"],
              "catalogName": os.environ["CATALOG_NAME"],
              "dateLastUpdated": os.environ["CATALOG_UPDATED"],
              "numberOfItems": os.environ["CATALOG_ITEMS"],
              "syncedAt": datetime.now(timezone.utc).isoformat(),
          }
          path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Guardar cambios válidos
        if: steps.catalog.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "La validación terminó correctamente, pero no hay cambios que publicar."
            exit 0
          fi

          git commit -m "Actualizar catálogo Shokz desde Impact"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Resumen
        if: steps.catalog.outputs.skip != 'true'
        shell: bash
        run: |
          {
            echo "# Catálogo Shokz actualizado"
            echo
            echo "- Catálogo: ${{ steps.catalog.outputs.catalog_name }}"
            echo "- ID: ${{ steps.catalog.outputs.catalog_id }}"
            echo "- Productos declarados por Impact: ${{ steps.catalog.outputs.catalog_items }}"
            echo "- Última actualización en Impact: ${{ steps.catalog.outputs.catalog_updated }}"
            echo
            echo "La importación, las pruebas y las validaciones finalizaron correctamente."
          } >> "${GITHUB_STEP_SUMMARY}"
