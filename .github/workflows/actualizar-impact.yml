name: Actualizar catálogos y promociones Impact

on:
  workflow_dispatch:
    inputs:
      force:
        description: Volver a comprobar todos los catálogos aunque Impact no marque cambios
        required: false
        type: boolean
        default: false
  schedule:
    # Dos horas UTC mantienen una única ejecución a las 09:37 de Europe/Madrid.
    # Se separa 20 minutos de la sincronización Awin para evitar conflictos.
    - cron: "37 7 * * *"
    - cron: "37 8 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-catalogos-main
  cancel-in-progress: false

jobs:
  horario:
    runs-on: ubuntu-latest
    outputs:
      ejecutar: ${{ steps.comprobar.outputs.ejecutar }}
    steps:
      - id: comprobar
        name: Mantener las 09:37 de España
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node - <<'NODE'
          const schedule = process.env.EVENT_SCHEDULE || "";
          const match = schedule.match(/^(\d+)\s+(\d+)\s+\*\s+\*\s+\*$/);
          if (!match) process.exit(1);
          const date = new Date();
          date.setUTCHours(Number(match[2]), Number(match[1]), 0, 0);
          const parts = new Intl.DateTimeFormat("en-GB", {
            timeZone: "Europe/Madrid",
            hour: "2-digit",
            minute: "2-digit",
            hourCycle: "h23"
          }).format(date);
          require("fs").appendFileSync(
            process.env.GITHUB_OUTPUT,
            `ejecutar=${parts === "09:37"}\n`
          );
          NODE

  actualizar:
    needs: horario
    if: needs.horario.outputs.ejecutar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
      IMPACT_API_TOKEN: ${{ secrets.IMPACT_API_TOKEN }}

    steps:
      - name: Descargar el main actual
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - id: base
        name: Guardar versión inicial
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verificar credenciales
        run: |
          : "${IMPACT_ACCOUNT_SID:?Falta el secreto IMPACT_ACCOUNT_SID}"
          : "${IMPACT_API_TOKEN:?Falta el secreto IMPACT_API_TOKEN}"

      - id: impacto
        name: Actualizar productos existentes, promociones y códigos
        env:
          FORCE_REFRESH: ${{ inputs.force }}
        run: |
          argumentos=(--report "$RUNNER_TEMP/impact-api-last.json")
          if [ "$FORCE_REFRESH" = "true" ]; then
            argumentos+=(--force)
          fi
          node scripts/refresh-impact.mjs "${argumentos[@]}"

      - name: Bloquear cambios de configuración desde la API
        run: |
          protegidos="$(git status --porcelain=v1 --untracked-files=all -- \
            .github assets scripts tests package.json package-lock.json \
            data/catalog/impact-sync-config.json data/catalog/merchants.json \
            data/config)"
          if [ -n "$protegidos" ]; then
            echo "::error::El paso de API intentó modificar código o configuración protegida."
            echo "$protegidos"
            exit 1
          fi

      - name: Reconstruir enlaces y páginas regionales
        if: steps.impacto.outputs.catalog_changed == 'true'
        run: npm run build:regions

      - name: Ejecutar pruebas
        run: npm test

      - name: Validar catálogo y afiliación
        run: npm run validate:catalog

      - name: Validar regiones
        run: npm run validate:regions

      - name: Validar SEO
        run: npm run validate:seo

      - name: Validar sitio
        run: npm run validate:site

      - name: Bloquear eliminaciones y cambios de código
        run: |
          eliminados="$(git diff --diff-filter=DR --name-only)"
          if [ -n "$eliminados" ]; then
            echo "::error::Impact intentó eliminar o renombrar archivos; publicación bloqueada."
            echo "$eliminados"
            exit 1
          fi

          protegidos="$(git status --porcelain=v1 --untracked-files=all -- \
            .github assets scripts tests package.json package-lock.json \
            data/catalog/impact-sync-config.json data/catalog/merchants.json)"
          if [ -n "$protegidos" ]; then
            echo "::error::La API de Impact intentó modificar código o configuración protegida."
            echo "$protegidos"
            exit 1
          fi

      - name: Guardar actualización en main
        if: steps.impacto.outputs.any_changed == 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::error::main cambió durante la actualización. Se cancela para evitar conflictos."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git grep --cached -q -F "$IMPACT_ACCOUNT_SID"; then
            echo "::error::Se detectó el Account SID en los archivos preparados."
            exit 1
          fi
          if git grep --cached -q -F "$IMPACT_API_TOKEN"; then
            echo "::error::Se detectó el token de Impact en los archivos preparados."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No hay cambios que publicar."
            exit 0
          fi

          git commit -m "Actualizar catálogos y promociones Impact"
          git push origin HEAD:main

      - name: Resumen
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/impact-api-last.json" ]; then
            exit 0
          fi
          {
            echo "# Sincronización Impact"
            echo
            echo "- Catálogos descargados: $(jq -r '.totals.downloadedCatalogs' "$RUNNER_TEMP/impact-api-last.json")"
            echo "- Catálogos retenidos: $(jq -r '.totals.heldCatalogs' "$RUNNER_TEMP/impact-api-last.json")"
            echo "- Ofertas actualizadas: $(jq -r '(.totals.canonicalOffersChanged + .totals.publicOffersChanged)' "$RUNNER_TEMP/impact-api-last.json")"
            echo "- Enlaces actualizados: $(jq -r '.totals.affiliateLinksChanged' "$RUNNER_TEMP/impact-api-last.json")"
            echo "- Promociones válidas: $(jq -r '.totals.promotions' "$RUNNER_TEMP/impact-api-last.json")"
            echo "- Códigos reales: $(jq -r '.totals.promotionCodes' "$RUNNER_TEMP/impact-api-last.json")"
            echo "- Programas nuevos retenidos para revisión: $(jq -r '.totals.unconfiguredPrograms' "$RUNNER_TEMP/impact-api-last.json")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar informe de la ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-impact-${{ github.run_id }}
          path: ${{ runner.temp }}/impact-api-last.json
          if-no-files-found: ignore
          retention-days: 30
